name: generate-pacman

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: YongLyhor

      - name: Copy generated SVGs to output/
        run: |
          mkdir -p output
          cp dist/pacman-contribution-graph.svg output/
          cp dist/pacman-contribution-graph-dark.svg output/

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No pacman changes to commit."
          else
            git commit -m "chore: update contribution pacman graph"
            git push
          fi